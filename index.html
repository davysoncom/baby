<!DOCTYPE html>
<html lang="en" class="is-booting">
  <head>
    <base href="/announcement/" />
    <link rel="canonical" href="/" />
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#f0e4e8" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <script>
      // Start the data fetch and hero image download before app.js parses,
      // so the hero paints as early as possible on slow connections.
      (function () {
        if (/[?&](preview|demo)(=|&|$)/.test(window.location.search)) return;
        function assetUrl(src, v) {
          if (!src) return "";
          if (/^https?:\/\//i.test(src) || src.indexOf("data:") === 0) {
            return src;
          }
          if (src.indexOf("../") === 0 || src.indexOf("/") === 0) return src;
          var path = src.replace(/^\.\//, "");
          return v ? path + "?v=" + encodeURIComponent(v) : path;
        }
        window.__announcementData = fetch("data.json?t=" + Date.now(), {
          cache: "no-store",
        })
          .then(function (res) {
            if (!res.ok) throw new Error("Failed to load data.json");
            return res.json();
          })
          .then(function (data) {
            try {
              var hero = data && data.hero;
              if (hero && hero.src) {
                var v = (data && (data.updatedAt || data.v)) || "";
                var link = document.createElement("link");
                link.rel = "preload";
                link.as = "image";
                link.setAttribute("fetchpriority", "high");
                if (hero.full && hero.width && hero.fullWidth) {
                  link.setAttribute(
                    "imagesrcset",
                    assetUrl(hero.src, v) +
                      " " +
                      hero.width +
                      "w, " +
                      assetUrl(hero.full, v) +
                      " " +
                      hero.fullWidth +
                      "w"
                  );
                  link.setAttribute(
                    "imagesizes",
                    hero.orient === "landscape"
                      ? "(min-width: 960px) 64rem, 100vw"
                      : "(min-width: 960px) 46rem, 100vw"
                  );
                } else {
                  link.href = assetUrl(hero.src, v);
                }
                document.head.appendChild(link);
              }
            } catch (_) {
              /* preload is best-effort */
            }
            return data;
          });
      })();
    </script>
    <title>A New Arrival</title>
    <meta property="og:title" content="A New Arrival" />
    <meta
      property="og:description"
      content="There's a new member of the family"
    />
    <meta name="description" content="There's a new member of the family" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://baby.davyson.com/" />
    <link rel="icon" href="/favicon.png" type="image/png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="coming-soon" class="coming-soon" hidden>
      <p class="coming-soon-label">A new arrival</p>
      <p class="coming-soon-text">Coming soon</p>
    </div>

    <main id="announcement" class="announcement" hidden>
      <section class="hero-stage" aria-label="Announcement">
        <div class="hero-pin">
          <div class="hero">
            <div class="hero-media-slot" id="hero-media-slot">
              <div class="hero-media" id="hero-media">
                <img
                  id="hero-image"
                  alt=""
                  decoding="async"
                  fetchpriority="high"
                />
              </div>
            </div>
            <div class="hero-band">
              <h1 id="first-name" class="first-name"></h1>
              <p id="middle-last" class="middle-last"></p>
              <div id="details" class="details"></div>
            </div>
          </div>
          <a
            class="scroll-hint"
            href="#gallery-a"
            aria-label="Scroll for more photos"
          >
            <span class="scroll-hint-chevron" aria-hidden="true"></span>
          </a>
        </div>
      </section>

      <section
        class="gallery"
        id="gallery-a"
        aria-label="Photos"
      ></section>

      <section class="contact contact-email">
        <a href="mailto:yds@davyson.com">yds@davyson.com</a>
      </section>

      <section
        class="gallery"
        id="gallery-b"
        aria-label="More photos"
      ></section>

      <section class="contact contact-address">
        <p>
          Chemin du Reposoir 15,<br />
          1255 Veyrier Switzerland
        </p>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
